<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #b3e5fc, #d1c4e9);
  font-family: 'Poppins', sans-serif;
  color: #222;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}
.container {
  text-align: center;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  padding: 40px 60px;
  width: 90%;
  max-width: 650px;
  animation: fadeIn 1.2s ease;
}
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}
h1 {
  font-size: 40px;
  margin-bottom: 15px;
}
input {
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #ccc;
  width: 70%;
  font-size: 18px;
  margin-top: 10px;
}
button {
  background-color: #6a1b9a;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 15px 35px;
  font-size: 18px;
  cursor: pointer;
  margin-top: 25px;
  transition: 0.3s ease;
}
button:hover {
  background-color: #8e24aa;
}
.back-btn {
  background-color: #ccc;
  color: #222;
  margin-top: 15px;
  margin-right: 10px;
}
.back-btn:hover {
  background-color: #b0b0b0;
}
.feelings {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}
.feeling {
  background: white;
  border-radius: 20px;
  padding: 20px 30px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.3s ease;
}
.feeling:hover {
  background: #f3e5f5;
  transform: translateY(-5px);
}
.tips {
  margin-top: 20px;
  font-size: 18px;
  color: #333;
}
.hidden {
  display: none;
}
</style>
</head>
<body>

<div class="container" id="step1">
  <h1>Welcome to MindMate</h1>
  <p style="font-size:20px;">Let's begin, what's your name?</p>
  <input type="text" id="name" placeholder="Enter your name...">
  <br>
  <button onclick="goToStep2()">Next ➜</button>
</div>

<div class="container hidden" id="step2">
  <h1>Hi <span id="userName"></span>!</h1>
  <p style="font-size:20px;">How are you feeling today?</p>
  <div class="feelings">
    <div class="feeling" onclick="showTips('Happy 😊')">😊 Happy</div>
    <div class="feeling" onclick="showTips('Sad 😢')">😢 Sad</div>
    <div class="feeling" onclick="showTips('Stressed 😣')">😣 Stressed</div>
    <div class="feeling" onclick="showTips('Angry 😠')">😠 Angry</div>
    <div class="feeling" onclick="showTips('Tired 😴')">😴 Tired</div>
  </div>
  <button class="back-btn" onclick="goToStep1()" >← Go Back</button>
</div>

<div class="container hidden" id="step3">
  <h1>Some tips for you, <span id="nameTips"></span></h1>
  <div id="tipsList" class="tips"></div>
  <button class="back-btn" onclick="goToStep2From3()">← Go Back</button>
  <button onclick="goToChat()">Start Chatting 💬</button>
</div>

<script>
const tips = {
  "Happy 😊": ["Keep spreading your positivity ", "Write down 3 things you’re grateful for ", "Call someone and share your happiness "],
  "Sad 😢": ["Have a good cry. It's a release, not a weakness ", "Take a deep breath and write your thoughts ", "Listen to calming music "],
  "Stressed 😣": ["Try 5 minutes of deep breathing ", "Go for a short walk ", "You’re doing your best, one step at a time "],
  "Angry 😠": ["Squeeze a stress ball or your fists to release the tension. ", "Do some stretches or punch a pillow ", "Channel your energy into journaling "],
  "Tired 😴": ["Drink water ", "Stretch or close your eyes for 2 minutes ", "Take a break — you deserve rest "]
};

function goToStep2() {
  const name = document.getElementById('name').value.trim();
  if (name === "") {
    alert("Please enter your name 💬");
    return;
  }
  document.getElementById('userName').innerText = name;
  document.getElementById('nameTips').innerText = name;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
}

function showTips(feeling) {
  const list = tips[feeling];
  let html = "";
  list.forEach(t => html += `<p>👉 ${t}</p>`);
  document.getElementById('tipsList').innerHTML = html;
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step3').classList.remove('hidden');
}

function goToChat() {
  window.open("http://localhost:8501", "_blank"); // link to your Streamlit chatbot
}
function goToStep1() {
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step1').classList.remove('hidden');
}

function goToStep2From3() {
  document.getElementById('step3').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
}

</script>

</body>
</html>
